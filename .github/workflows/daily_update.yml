name: Daily Voice List Generation

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  generate_voice_list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.x'
